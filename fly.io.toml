app = "a11y-pdf-audit"
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "a11y_data_3gb"
  destination = "/a11y_data"
  
[env]
  OUTPUT_DIR = "/a11y_data/output"
